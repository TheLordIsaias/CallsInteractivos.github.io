<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interactivo de GTA V</title>
    
    <!-- Tailwind CSS para estilos rápidos y responsivos -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        /* Estilos generales para asegurar que el mapa ocupe toda la pantalla */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #0f172a; /* Fondo oscuro */
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        #map {
            height: 100vh;
            width: 100vw;
            background-color: #0f172a; /* Color de fondo del contenedor del mapa */
        }

        /* Personalización de los Popups de Leaflet para el tema oscuro */
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background-color: #1e293b; /* slate-800 */
            color: #f8fafc; /* slate-50 */
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }
        
        .leaflet-popup-content-wrapper {
            border-radius: 0.5rem;
        }

        .leaflet-popup-content {
            margin: 16px;
            line-height: 1.5;
        }

        .leaflet-container a.leaflet-popup-close-button {
            color: #94a3b8;
            padding: 8px;
        }
        
        .leaflet-container a.leaflet-popup-close-button:hover {
            color: #f8fafc;
        }

        /* Título sobre el mapa */
        .map-title-overlay {
            position: absolute;
            top: 20px;
            left: 50px; /* Espacio para los controles de zoom */
            z-index: 1000;
            pointer-events: none; /* Permite hacer clic a través del texto */
        }
    </style>
</head>
<body>

    <!-- Contenedor principal del Mapa -->
    <div id="map"></div>

    <!-- Título flotante -->
    <div class="map-title-overlay">
        <h1 class="text-3xl font-bold text-white drop-shadow-md bg-slate-900/60 p-3 rounded-lg border border-slate-700 backdrop-blur-sm">
            Mapa Interactivo
        </h1>
        <p class="text-slate-300 mt-2 text-sm drop-shadow bg-slate-900/60 p-2 rounded-lg inline-block backdrop-blur-sm">
            Explora las ubicaciones haciendo clic en los marcadores.
        </p>
    </div>

    <script>
        // 1. Configuración inicial del mapa
        // Usamos L.CRS.Simple para mapear sobre una imagen plana en lugar de un globo terráqueo.
        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -1, // Permite alejar la cámara un poco más del tamaño original
            maxZoom: 3,  // Permite hacer zoom in
            zoomControl: false // Desactivamos el control por defecto para moverlo
        });

        // Mover los controles de zoom a la parte superior izquierda, debajo del título
        L.control.zoom({ position: 'topleft' }).addTo(map);

        // 2. Definición de límites (Bounds) e Imagen
        // Dimensiones de la imagen según tu requerimiento
        const width = 2048;
        const height = 2048;
        const imageUrl = 'GTAV_ATLUS_2048x2048.jpg';

        // Los límites se definen como [[y_min, x_min], [y_max, x_max]]
        const bounds = [[0, 0], [height, width]];

        // Añadimos la imagen al mapa
        const imageOverlay = L.imageOverlay(imageUrl, bounds).addTo(map);

        // Centrar el mapa en la imagen al cargar y limitar el área de paneo
        map.fitBounds(bounds);
        map.setMaxBounds(bounds); // Evita que el usuario arrastre el mapa fuera de la imagen

        // 3. Simulación de carga de datos desde un JSON
        // Este string simula la respuesta de una API o la lectura de un archivo JSON.
        const mockJsonData = `[
            {
                "id": "airport",
                "title": "Los Santos International Airport",
                "description": "El aeropuerto principal que sirve a la ciudad de Los Santos. Cuenta con múltiples pistas y hangares.",
                "x": 650,
                "y": 300
            },
            {
                "id": "chiliad",
                "title": "Mount Chiliad",
                "description": "El pico más alto del estado de San Andreas. Famoso por sus senderos escarpados y misterios.",
                "x": 1024,
                "y": 1650
            },
            {
                "id": "sandy_shores",
                "title": "Sandy Shores",
                "description": "Un pequeño pueblo desértico ubicado a orillas del Alamo Sea. Hogar del aeródromo de Sandy Shores.",
                "x": 1350,
                "y": 1100
            },
            {
                "id": "downtown",
                "title": "Downtown Los Santos",
                "description": "El bullicioso centro financiero y comercial de la ciudad, lleno de rascacielos y zonas en construcción.",
                "x": 1050,
                "y": 680
            },
            {
                "id": "paleto_bay",
                "title": "Paleto Bay",
                "description": "Un tranquilo pueblo costero ubicado en el extremo norte del condado de Blaine.",
                "x": 800,
                "y": 1900
            },
            {
                "id": "military_base",
                "title": "Fort Zancudo",
                "description": "Una base militar fuertemente custodiada. El espacio aéreo está restringido.",
                "x": 380,
                "y": 1050
            }
        ]`;

        // 4. Procesamiento de los datos y creación de marcadores
        try {
            // Parsear el string JSON a objetos JavaScript
            const locations = JSON.parse(mockJsonData);

            // Iterar sobre cada ubicación para crear un marcador
            locations.forEach(loc => {
                // En L.CRS.Simple, Leaflet espera coordenadas en formato [y, x] (equivalente a latitud, longitud)
                const markerCoordinates = [loc.y, loc.x];

                // Crear el marcador y añadirlo al mapa
                const marker = L.marker(markerCoordinates).addTo(map);

                // Construir el contenido HTML para el Popup
                const popupContent = `
                    <div class="min-w-[200px]">
                        <h3 class="text-lg font-bold text-blue-400 mb-2 border-b border-slate-600 pb-1">${loc.title}</h3>
                        <p class="text-sm text-slate-300">${loc.description}</p>
                        <div class="mt-3 text-xs text-slate-500 bg-slate-800 p-1 rounded font-mono text-center">
                            Coords: [x: ${loc.x}, y: ${loc.y}]
                        </div>
                    </div>
                `;

                // Vincular el Popup al marcador
                marker.bindPopup(popupContent);
            });

        } catch (error) {
            console.error("Error procesando los datos JSON de ubicaciones:", error);
        }

    </script>
</body>
</html>
